name: Compilar bloqueo Android
# Compilar el APK tarda ~7 min: solo vale la pena cuando cambia lo nativo o la configuración de la app.
# Docs, capturas, textos de la tienda y pantallas en TypeScript no lo disparan (las pruebas y el typecheck
# se corren en local antes de cada merge). Se puede correr a mano desde Actions con "Run workflow".
on:
  pull_request:
    paths:
      - 'apps/movil/modules/**'
      - 'apps/movil/app.json'
      - 'apps/movil/app.config.js'
      - 'apps/movil/eas.json'
      - 'apps/movil/package.json'
      - 'package-lock.json'
      - '.github/workflows/compilar-bloqueo-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_URL_ALERTAS: ninguno
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test -w @pixel-hack/movil
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/movil
      - name: Compilar APK con el módulo de bloqueo
        working-directory: apps/movil/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
